<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#14213d;--mut:#5b6678;--line:#d9dee5;--teal:#0f766e;--amb:#c77d00;--red:#b42318;--navy:#2c4a7c;

@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1624;--card:#17213a;--ink:#e8edf6;--mut:#9aa7bd;--line:#2b3956;--teal:#35c2b2;--amb:#f0b34a;--red:#ff8a78;--navy:#7fa4e6}}
:root[data-theme="dark"]{--bg:#0f1624;--card:#17213a;--ink:#e8edf6;--mut:#9aa7bd;--line:#2b3956;--teal:#35c2b2;--amb:#f0b34a;--red:#ff8a78;--navy:#7fa4e6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Source Sans 3",system-ui,sans-serif}
header{padding:20px 20px 0;max-width:1100px;margin:auto}h1{font-size:24px;margin:0}header p{margin:4px 0 14px;color:var(--mut)}
nav{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
nav button{background:none;border:0;padding:10px 14px;font:600 15px inherit;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent}
nav button[aria-selected=true]{color:var(--ink);border-color:var(--teal)}nav button:focus-visible{outline:2px solid var(--teal)}
main{max-width:1100px;margin:auto;padding:16px 20px 40px}section{display:none}section.on{display:block}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kc{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px}.kc b{display:block;font-size:24px}.kc span{color:var(--mut);font-size:13px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.c{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;min-width:0}.c h2{font-size:16px;margin:0 0 2px}.c p{margin:0 0 8px;color:var(--mut);font-size:13px}
.w{overflow-x:auto}svg{display:block;width:100%;height:auto}svg text{fill:var(--mut);font-size:11px}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:5px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}th:first-child,td:first-child{text-align:left}
.pos{color:var(--teal)}.neg{color:var(--red)}.tag{padding:1px 7px;border-radius:9px;border:1px solid var(--line);font-size:12px}
.note{border-left:3px solid var(--amb);padding:8px 12px;background:var(--card);margin:14px 0;font-size:14px}
</style></head><body>
<header><h1>GulfMart retail performance, 2023 to 2025</h1><p>Synthetic data: 25 stores, 500 products, 5,000 customers, 120,000 transactions. Amounts in SAR.</p>
<nav role="tablist" id="nav"></nav></header><main id="m"></main>
<script>

arket",505418.0,-12.1,3.7,5.2,"Profitable but under-selling",25.7,0.77],["Madinah HYP-05","Hypermarket",575386.0,29.0,3.9,6.8,"Star",25.9,1.01],["Buraidah SUP-06","Supermarket",319846.0,-6.4,1.3,8.3,"Profitable but under-selling",25.3,0.96],["Jeddah SUP-07","Supermarket",218768.0,32.3,0.9,7.8,"Star",24.9,0.9],["Makkah SUP-08","Supermarket",259674.0,0.5,0.0,8.6,"Star",24.0,0.99],["Tabuk SUP-09","Supermarket",298815.0,41.1,0.7,13.8,"Star",24.7,1.59],["Riyadh SUP-10","Supermarket",232501.0,4.7,2.8,9.0,"Star",26.8,1.03],["Khobar SUP-11","Supermarket",310059.0,-11.6,1.0,8.9,"Profitable but under-selling",25.0,1.03],["Abha SUP-12","Supermarket",271501.0,23.0,2.7,9.6,"Star",26.7,1.1],["Taif SUP-13","Supermarket",301413.0,19.2,2.0,7.9,"Star",26.0,0.9],["Dammam SUP-14","Supermarket",346703.0,20.7,3.0,8.8,"Star",27.0,1.01],["Madinah SUP-15","Supermarket",225738.0,25.2,0.3,6.4,"Star",24.3,0.73],["Buraidah EXP-16","Express",153554.0,37.7,0.3,42.1,"Star",27.3,1.57],["Jeddah EXP-17","Express",123713.0,14.1,-2.8,16.1,"Volume without margin",24.2,0.6],["Makkah EXP-18","Express",132464.0,4.5,-0.9,18.5,"Volume without margin",26.2,0.69],["Tabuk EXP-19","Express",146209.0,-5.3,0.5,28.2,"Profitable but under-selling",27.5,1.06],["Riyadh EXP-20","Express",132078.0,24.6,-1.4,26.8,"Volume without margin",25.6,1.0],["Khobar EXP-21","Express",157907.0,-9.1,-2.1,22.0,"Problem store",24.9,0.82],["Abha EXP-22","Express",81517.0,17.1,-1.0,26.9,"Volume without margin",26.0,1.0],["Taif NEI-23","Neighborhood",84475.0,13.6,-3.1,38.5,"Volume without margin",24.9,1.01],["Dammam NEI-24","Neighborhood",101114.0,-14.2,-3.5,38.2,"Problem store",24.5,1.0],["Madinah NEI-25","Neighborhood",64944.0,36.9,-2.4,25.0,"Volume without margin",25.6,0.65]],"cat":[["Baby Care",11.8,10.8,23.6,0.6],["Beauty",19.8,29.3,38.0,0.0],["Electronics",9.0,4.2,11.8,17.3],["Food & Beverages",14.2,12.4,22.3,1.9],["Fresh Food",14.9,12.1,20.9,2.0],["Health & Wellness",7.3,7.7,27.1,0.0],["Household",15.0,14.2,24.2,0.3],["Personal Care",8.0,9.2,29.5,0.0]],"disc":[[0,29.9,3.68,0.0],[5,26.0,3.86,0.0],[10,22.0,4.14,0.0],[15,17.7,4.44,2.1],[20,12.7,4.7,5.0],[25,6.7,4.97,25.2]],"scen":[["Cap discount at 20%",17900.0,1.1,26.0],["Cap discount at 15%",66019.0,3.9,26.7],["Cap discount at 10%",132601.0,7.9,27.7],["No promo on Electronics",27645.0,1.7,26.1],["Cap 15% + no Electronics promo",87732.0,5.2,27.0],["Deep promo only in peak events (else cap 10%)",110396.0,6.6,27.4]],"ev":[["Eid Adha",24.0,25.9],["Eid Fitr",29.0,24.8],["National Day",18.0,26.0],["Ramadan",36.0,24.8],["White Friday",49.0,25.3]],"rfm":[["Champions",23.2,49.8],["Loyal",23.9,25.2],["At risk (high value)",5.9,8.1],["Needs attention",13.1,7.3],["Lapsed",27.1,7.1],["New / Promising",6.8,2.5]],"fy26":[6673984.0,2.2,5.7]};
const $=s=>document.querySelector(s),f=(n,d=0)=>n.toLocaleString("en",{maximumFractionDigits:d}),M=n=>f(n/1e6,2)+"M",K=n=>f(n/1e3)+"k";
const cl=n=>n>=0?"pos":"neg",sg=(n,d=1)=>(n>=0?"+":"")+f(n,d);
const QC={"Star":"var(--teal)","Volume without margin":"var(--amb)","Profitable but under-selling":"var(--navy)","Problem store":"var(--red)"};
function line(a,fc){const W=520,H=190,p=34,all=a.map(x=>x[1]).concat(fc?fc.map(x=>x[3]):[]),mx=Math.max(...all)*1.05,mn=0,n=a.length+(fc?fc.length:0);
const X=i=>p+i*(W-p-8)/(n-1),Y=v=>H-22-(v-mn)/(mx-mn)*(H-34);let s=`<svg viewBox="0 0 ${W} ${H}" role="img">`;
for(let t=0;t<=4;t++){const v=mx*t/4;s+=`<line x1="${p}" x2="${W-8}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${p-4}" y="${Y(v)+3}" text-anchor="end">${K(v)}</text>`}
a.forEach((x,i)=>{if(i%6==0)s+=`<text x="${X(i)}" y="${H-6}" text-anchor="middle">${x[0].slice(0,7)}</text>`});
s+=`<polyline fill="none" stroke="var(--navy)" stroke-width="2" points="${a.map((x,i)=>X(i)+","+Y(x[1])).join(" ")}"/>`;
if(fc){const o=a.length;s+=`<polygon fill="var(--teal)" opacity=".18" points="${fc.map((x,i)=>X(o+i)+","+Y(x[3])).join(" ")} ${fc.slice().reverse().map((x,i)=>X(o+fc.length-1-i)+","+Y(x[2])).join(" ")}"/><polyline fill="none" stroke="var(--teal)" stroke-width="2" stroke-dasharray="5 3" points="${fc.map((x,i)=>X(o+i)+","+Y(x[1])).join(" ")}"/>`}
return s+"</svg>"}
function bars(rows,o={}){const L=o.l||150,W=520,h=22,H=rows.length*h+6,mx=Math.max(...rows.map(r=>Math.abs(r[1]))),z=o.neg?L+(W-L-40)/2:L;let s=`<svg viewBox="0 0 ${W} ${H}" role="img">`;
rows.forEach((r,i)=>{const w=Math.abs(r[1])/mx*(o.neg?(W-L-40)/2:(W-L-50)),y=i*h+3,x=o.neg&&r[1]<0?z-w:z;
s+=`<text x="${L-6}" y="${y+14}" text-anchor="end">${r[0]}</text><rect x="${x}" y="${y+2}" width="${Math.max(w,1)}" height="${h-8}" rx="2" fill="${r[2]||"var(--navy)"}"/><text x="${(o.neg&&r[1]<0?x-4:x+w+4)}" y="${y+14}" text-anchor="${o.neg&&r[1]<0?"end":"start"}">${o.fmt?o.fmt(r[1]):f(r[1],1)}</text>`});return s+"</svg>"}
function pair(rows,a,b){const L=130,W=520,h=34,mx=Math.max(...rows.flatMap(r=>[r[1],r[2]])),H=rows.length*h+22;let s=`<svg viewBox="0 0 ${W} ${H}" role="img"><text x="${L}" y="11">■ sales share</text><text x="${L+110}" y="11" style="fill:var(--amb)">■ profit share</text>`;
rows.forEach((r,i)=>{const y=i*h+20;s+=`<text x="${L-6}" y="${y+14}" text-anchor="end">${r[0]}</text><rect x="${L}" y="${y}" width="${r[1]/mx*(W-L-50)}" height="10" fill="var(--navy)"/><rect x="${L}" y="${y+12}" width="${r[2]/mx*(W-L-50)}" height="10" fill="var(--amb)"/><text x="${L+Math.max(r[1],r[2])/mx*(W-L-50)+4}" y="${y+14}">${f(r[1],1)}% / ${f(r[2],1)}%</text>`});return s+"</svg>"}
const card=(t,p,b)=>`<div class="c"><h2>${t}</h2><p>${p}</p><div class="w">${b}</div></div>`;
const y25=D.kpi[2025],y24=D.kpi[2024];
const kc=(v,l)=>`<div class="kc"><b>${v}</b><span>${l}</span></div>`;
const tabs={
"Overview":()=>`<div class="k">${kc(M(y25.net_sales),"Net sales 2025")}${kc(sg(y25.net_sales_yoy*100)+"%","Sales growth (2024: "+sg(y24.net_sales_yoy*100)+"%)")}${kc(f(y25.gm_pct*100,1)+"%","Gross margin")}${kc(f(y25.atv,0),"Average transaction")}${kc(f(y25.discount_rate*100,1)+"%","Discount rate")}</div>
<div class="g">${card("Monthly net sales and 2026 forecast","FY2026 forecast "+M(D.fy26[0])+" ("+sg(D.fy26[1])+"% vs 2025). Backtest error "+D.fy26[2]+"%.",line(D.monthly,D.fc))}
${card("Peak events lift sales, with thinner margin","Sales per day vs a normal day, and gross margin %",bars(D.ev.map(e=>[e[0]+" · GM "+e[2]+"%",e[1]]),{l:190,fmt:v=>"+"+v+"%"}))}
${card("Category profit vs sales share","Beauty earns far more than its share; Electronics far less",pair(D.cat,0,0))}</div>`,
"Stores":()=>{const q={};D.stores.forEach(s=>q[s[6]]=(q[s[6]]||0)+1);
return `<div class="k">${Object.keys(QC).map(k=>kc(q[k]||0,k)).join("")}</div>
<div class="g">${card("Margin gap vs target by store","Percentage points vs the store's margin target, 2025",bars(D.stores.slice().sort((a,b)=>a[4]-b[4]).map(s=>[s[0].replace(/HYP|SUP|EXP|NEI/,"").trim(),s[4],QC[s[6]]]),{l:130,neg:1,fmt:v=>sg(v)}))}</div>
<div class="c" style="margin-top:14px"><h2>Store scorecard, 2025</h2><p>Sales/sqft index compares a store with the median of its own format. Targets are synthetic.</p><div class="w"><table><tr><th>Store</th><th>Format</th><th>Net sales</th><th>vs target</th><th>GM %</th><th>Margin gap pp</th><th>Sales/sqft idx</th><th>Action group</th></tr>
${D.stores.slice().sort((a,b)=>b[2]-a[2]).map(s=>`<tr><td>${s[0]}</td><td>${s[1]}</td><td>${K(s[2])}</td><td class="${cl(s[3])}">${sg(s[3])}%</td><td>${s[7]}</td><td class="${cl(s[4])}">${sg(s[4])}</td><td class="${s[8]<.85?"neg":""}">${s[8]}</td><td><span class="tag" style="border-color:${QC[s[6]]}">${s[6]}</span></td></tr>`).join("")}</table></div></div>`},
"Promotions":()=>`<div class="note">Discounts cost more than they earn back. Deeper discounts add units (about 5% at 5% off, up to 35% at 25% off) but gross margin falls from 29.9% to 6.7%.</div>
<div class="g">${card("Gross margin % by discount depth","Share of transactions that lose money is in the bar label",bars(D.disc.map(d=>[(d[0]?d[0]+"% off":"No discount")+" · loss "+d[3]+"%",d[1],d[0]>=20?"var(--red)":d[0]>=10?"var(--amb)":"var(--teal)"]),{l:180,fmt:v=>v+"%"}))}
${card("Gross profit impact of discount rules","Scenario results for 2025, using estimated category elasticity. Net sales change is under 0.5% in every case.",bars(D.scen.map(s=>[s[0],s[1],"var(--teal)"]),{l:210,fmt:v=>"+"+K(v)}))}
${card("Loss-making transactions by category","Electronics is 9% of sales but holds half of all loss-making transactions",bars(D.cat.filter(c=>c[4]>0).sort((a,b)=>b[4]-a[4]).map(c=>[c[0],c[4],"var(--red)"]),{l:150,fmt:v=>v+"% of tx"}))}</div>`,
"Customers":()=>`<div class="g">${card("Customer value concentration","Share of customers vs share of sales by RFM segment",pair(D.rfm,0,0).replace("sales share","customers").replace("profit share","sales"))}</div><div class="note">Champions are about a quarter of customers and half of sales. The at-risk high-value group is small but worth a targeted win-back offer.</div>`};
const nav=$("#nav");Object.keys(tabs).forEach((k,i)=>{const b=document.createElement("button");b.textContent=k;b.setAttribute("role","tab");b.onclick=()=>show(k);nav.append(b)});
function show(k){[...nav.children].forEach(b=>b.setAttribute("aria-selected",b.textContent==k));$("#m").innerHTML="<section class='on'>"+tabs[k]()+"</section>"}
show("Overview");
</script></body></html>
